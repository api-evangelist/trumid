note: >-
  Trumid publishes no client SDK for a Trumid API — there is no public REST/OpenAPI
  surface to wrap. What it does distribute is (a) one open-source FIX engine binding
  maintained in its GitHub org, and (b) installable desktop/Excel client software
  from the Client Center. No `SDKs` pointer is wired in apis.yml: node-quickfix is a
  general-purpose QuickFIX wrapper, not a Trumid API client library, and wiring the
  SDK check off it would misrepresent the surface.
