aid: trumid
name: Trumid
description: 'Trumid is a New York-based financial technology company and electronic
  trading platform for the corporate bond market, operating an SEC-registered Alternative
  Trading System (ATS) through Trumid Financial, LLC. The platform covers U.S. dollar-denominated
  Investment Grade, High Yield, Distressed and Emerging Market credit, and delivers
  a suite of protocols in a single application — Request-for-Quote (RFQ), Trumid Auto-Pilot,
  Attributed Trading, Portfolio Trading and Swarms — alongside Full Self Trading (FST)
  automation. Its data and analytics line, built on the Fair Value Market Price (FVMP)
  predictive pricing model, publishes continuous prices for roughly 22,000 U.S. dollar-denominated
  corporate bonds refreshed every 30 seconds, plus liquidity scores, confidence scores
  and the Bond Neighborhood similarity model. Client integration is institutional rather
  than self-service: connectivity runs over FIX through a network of OMS/EMS partners,
  and Trumid Data Solutions is delivered via real-time feeds, SFTP file delivery and
  a Trumid Excel Add-in. There is no public developer portal, no public REST/OpenAPI
  surface and no self-service signup — onboarding runs through the Trumid Integration
  and Product Support team.'
